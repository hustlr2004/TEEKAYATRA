services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - teeka-yatra-data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/teeka_yatra.db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  teeka-yatra-data:
