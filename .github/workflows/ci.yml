name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Bandit
        run: bandit -q -r app
      - name: Docker build
        working-directory: .
        run: docker build -t teeka-yatra-backend ./backend
