[tool.coverage.run]
source = ["app"]
omit = [
  "app/performance_seed.py",
  "app/worker.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false
exclude = ["tests", "alembic", "app/performance_seed.py"]
